aid: wing-venture-capital
name: Wing Venture Capital
description: >-
  Wing Venture Capital is an early-stage venture firm founded in 2013 by Peter
  Wagner and Gaurav Garg (both former partners at Sequoia Capital and Accel) and
  headquartered in Palo Alto, California. Wing invests at the stealth, seed, and
  Series A stages in companies building the "AI-first" technology stack, and
  positions itself as a long-term company builder rather than a passive investor.
  Its thesis spans autonomous applications, AI and machine learning, data
  platforms and infrastructure, product-led growth (PLG), Web3, and bio x data.
  Wing raised its fourth flagship fund, Wing Four, a $600M early-stage vehicle,
  in 2023. Notable outcomes across its portfolio include Snowflake, Cohesity,
  Gong, Shape Security, and Deepgram, and it operates a Founder Success Platform
  plus the ET30 (Enterprise Tech 30) research program led by its research team.
